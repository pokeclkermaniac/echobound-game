    <ellipse cx="12" cy="-4" rx="7" ry="10" fill="#fff"/>
    <circle cx="-10" cy="-2" r="3.5" fill="#151426"/>
    <circle cx="10" cy="-2" r="3.5" fill="#151426"/>
    <path d="M-15 14q15 15 30 0" fill="none" stroke="#151426" stroke-width="6" stroke-linecap="round"/>
  </g>
  <path d="M42 159q154 18 300 4M418 164q145 12 277-5" fill="none" stroke="#f6d35d" stroke-width="8" stroke-linecap="round"/>
